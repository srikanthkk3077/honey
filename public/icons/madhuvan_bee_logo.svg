<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Madhuvan Honey Bee Logo</title>
  <desc id="desc">A golden and dark brown bee emblem on a soft honey-yellow rounded background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4CF"/>
      <stop offset="1" stop-color="#F5C85A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFD96A"/>
      <stop offset="1" stop-color="#C77A12"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <g stroke="#56300C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- antennae -->
    <path d="M116 70 Q101 50 91 56" fill="none"/>
    <path d="M140 70 Q155 50 165 56" fill="none"/>
    <circle cx="89" cy="55" r="5" fill="#56300C" stroke="none"/>
    <circle cx="167" cy="55" r="5" fill="#56300C" stroke="none"/>
    <!-- wings -->
    <path d="M119 91 C93 61 63 72 68 98 C72 119 98 119 119 105 Z" fill="#FFF9E8"/>
    <path d="M137 91 C163 61 193 72 188 98 C184 119 158 119 137 105 Z" fill="#FFF9E8"/>
    <path d="M116 94 Q91 83 78 91 M140 94 Q165 83 178 91" fill="none" stroke="#D6A33B" stroke-width="3"/>
    <!-- legs -->
    <path d="M111 143 L95 158 L86 158 M145 143 L161 158 L170 158" fill="none"/>
    <path d="M116 153 L106 170 L97 172 M140 153 L150 170 L159 172" fill="none"/>
    <!-- body -->
    <path d="M128 77 C105 77 94 100 99 126 C103 148 116 165 128 175 C140 165 153 148 157 126 C162 100 151 77 128 77 Z" fill="url(#gold)"/>
    <!-- stripes -->
    <path d="M101 105 Q128 116 155 105 L153 117 Q128 128 103 117 Z" fill="#35210E" stroke="none"/>
    <path d="M104 128 Q128 139 152 128 L147 140 Q128 150 109 140 Z" fill="#35210E" stroke="none"/>
    <path d="M114 151 Q128 158 142 151 L135 163 L128 170 L121 163 Z" fill="#35210E" stroke="none"/>
    <!-- head -->
    <circle cx="128" cy="73" r="17" fill="#D9941A"/>
    <circle cx="121" cy="72" r="3" fill="#35210E" stroke="none"/>
    <circle cx="135" cy="72" r="3" fill="#35210E" stroke="none"/>
    <!-- small crown / honey mark -->
    <path d="M117 55 L122 47 L128 53 L134 47 L139 55" fill="none" stroke="#8E520D" stroke-width="4"/>
    <!-- subtle abdomen highlight -->
    <path d="M116 88 Q128 83 140 88" fill="none" stroke="#FFF0A9" stroke-width="3"/>
  </g>
  <g fill="#8C4B08" opacity=".9">
    <circle cx="54" cy="188" r="3"/><circle cx="202" cy="182" r="3"/>
    <path d="M48 204 l5 -7 l5 7 l-5 7 Z"/>
    <path d="M196 204 l5 -7 l5 7 l-5 7 Z"/>
  </g>
</svg>